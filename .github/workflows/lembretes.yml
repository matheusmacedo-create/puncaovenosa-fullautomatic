name: Lembretes de recuperação

# 8 rodadas por dia, das 7h às 21h de Brasília, de 2 em 2 horas. Fica aqui, e
# não no vercel.json, porque o plano Hobby da Vercel recusa no deploy qualquer
# cron que rode mais de uma vez por dia.
#
# Cada rodada só envia o que as regras de lib/lembretes-regras.ts devem
# naquele momento — rodar mais vezes deixa o lembrete chegar perto das 3h de
# abandono, em vez de na manhã seguinte, mas não manda mais e-mails por pessoa.
#
# Precisa de dois segredos do repositório (Settings > Secrets and variables >
# Actions): CRON_SECRET (o mesmo valor da Vercel) e SITE_URL (endereço público,
# sem barra no fim). O GitHub só roda agendamento a partir da main, e pode
# atrasar alguns minutos em horário de pico — por isso o minuto 7.
on:
  schedule:
    # Horários em UTC: 10,12,...,22 e 00 UTC = 7h, 9h, ..., 19h e 21h de Brasília.
    - cron: '7 0,10,12,14,16,18,20,22 * * *'
  workflow_dispatch:

concurrency:
  group: lembretes
  cancel-in-progress: false

jobs:
  rodada:
    name: Rodada de lembretes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Chamar a varredura
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          SITE_URL: ${{ secrets.SITE_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$SITE_URL" ]; then
            echo "::error::Defina os segredos CRON_SECRET e SITE_URL no repositório."
            exit 1
          fi
          resposta=$(curl -fsS --max-time 180 -H "Authorization: Bearer $CRON_SECRET" "$SITE_URL/api/lembretes/sync")
          echo "$resposta"
          echo "$resposta" | grep -q '"executada":true' || echo "::warning::Rodada não executada: $resposta"
